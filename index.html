<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>3D graphical ball - Demo</title>
<style>
body { margin:0; overflow:hidden; background:#333; }
canvas { display:block; }
.controls { position:absolute; top:10px; left:10px; color:white; font-family:Roboto,sans-serif; }
#fpsLabel{
    color:white;
    margin-left:12px;
    font-family:Roboto,sans-serif;
}

#fpsBar{
    display:inline-block;
    width:120px;
    height:10px;
    margin-left:6px;
    background:#555;
    border:1px solid #777;
    border-radius:4px;
    overflow:hidden;
    vertical-align:middle;
}

#fpsFill{
    width:0%;
    height:100%;
    background:#00ff66;
    transition:width .1s linear;
}
</style>
</head>
<body>
<div class="controls">
Color:
<input type="color" id="colorPicker" value="#b6c41d">

Size:
<input type="range" id="sizeSlider" min="0.5" max="4.75" step="0.01" value="1">

<button id="openLogs">Logs</button><br><br>
<span id="fpsLabel">FPS: 0</span>
<div id="fpsBar">
    <div id="fpsFill"></div>
</div>
</div>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.147/build/three.module.js';

let scene = new THREE.Scene();
let camera = new THREE.PerspectiveCamera(45, window.innerWidth/window.innerHeight, 0.1, 100);
camera.position.set(0,0,5);

let renderer = new THREE.WebGLRenderer({antialias:true, alpha:true});
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

// Light
let light = new THREE.PointLight(0xffffff,1);
light.position.set(5,5,5);
scene.add(light);

// Controls
let colorInput = document.getElementById("colorPicker");
let sizeSlider = document.getElementById("sizeSlider");

// Material
let material = new THREE.MeshStandardMaterial({ 
    color: new THREE.Color(colorInput.value),
    transparent: true,
    opacity: 0.7,
    roughness: 0.5,
    metalness: 0
});

// Geometry
let sphereGeom = new THREE.IcosahedronGeometry(1,5);
let sphere = new THREE.Mesh(sphereGeom, material);
scene.add(sphere);

// Soft-body setup
let origPositions = sphereGeom.attributes.position.array.slice();
let vertices = sphereGeom.attributes.position.array;
let velocities = new Float32Array(vertices.length);
let damping = 0.85;
let spring = 0.25;
let jiggle = 0.025;

// Spin
let spinVelocity = new THREE.Vector3(0,0,0);
let spinDamping = 0.9;

// Resize
window.addEventListener('resize', ()=>{
    camera.aspect = window.innerWidth/window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
});

// Interaction state
let isDragging = false;
let prevPos = [0,0];
let pinchDist = 0, startScale = 1;

// Utilities
function distance(t0,t1){ return Math.hypot(t0[0]-t1[0], t0[1]-t1[1]); }

// Touch events
renderer.domElement.addEventListener('touchstart', e=>{
    if(e.touches.length === 1){
        isDragging = true;
        prevPos = [e.touches[0].clientX, e.touches[0].clientY];
        // Boop jiggle + spin
        for(let i=0;i<velocities.length;i++) velocities[i] += (Math.random()-0.5)*jiggle;
        spinVelocity.x += (Math.random()-0.5)*0.05;
        spinVelocity.y += (Math.random()-0.5)*0.05;
        spinVelocity.z += (Math.random()-0.5)*0.05;
    } else if(e.touches.length === 2){
        pinchDist = distance([e.touches[0].clientX, e.touches[0].clientY],
                             [e.touches[1].clientX, e.touches[1].clientY]);
        startScale = sphere.scale.x;
    }
});

renderer.domElement.addEventListener('touchmove', e=>{
    e.preventDefault();
    if(e.touches.length === 1 && isDragging){
        let dx = e.touches[0].clientX - prevPos[0];
        let dy = e.touches[0].clientY - prevPos[1];
        prevPos = [e.touches[0].clientX, e.touches[0].clientY];
        sphere.position.x += dx * 0.005;
        sphere.position.y -= dy * 0.005;
    } else if(e.touches.length === 2){
        let newDist = distance([e.touches[0].clientX, e.touches[0].clientY],
                               [e.touches[1].clientX, e.touches[1].clientY]);
        let scale = startScale * newDist / pinchDist;
        sphere.scale.set(scale, scale, scale);
    }
});

renderer.domElement.addEventListener('touchend', e=>{
    if(e.touches.length === 0) isDragging = false;
});

// --- Mouse support ---
renderer.domElement.addEventListener('mousedown', e=>{
    if(e.button === 0){ // left click
        isDragging = true;
        prevPos = [e.clientX, e.clientY];
        // Boop jiggle + spin
        for(let i=0;i<velocities.length;i++) velocities[i] += (Math.random()-0.5)*jiggle;
        spinVelocity.x += (Math.random()-0.5)*0.05;
        spinVelocity.y += (Math.random()-0.5)*0.05;
        spinVelocity.z += (Math.random()-0.5)*0.05;
    }
});

renderer.domElement.addEventListener('mousemove', e=>{
    if(isDragging){
        let dx = e.clientX - prevPos[0];
        let dy = e.clientY - prevPos[1];
        prevPos = [e.clientX, e.clientY];
        sphere.position.x += dx * 0.005;
        sphere.position.y -= dy * 0.005;
    }
});

renderer.domElement.addEventListener('mouseup', e=>{
    if(e.button === 0) isDragging = false;
});

renderer.domElement.addEventListener('wheel', e=>{
    e.preventDefault();
    let scale = sphere.scale.x * (1 - e.deltaY * 0.001);
    sphere.scale.set(scale, scale, scale);
}, {passive:false});

const fpsLabel = document.getElementById("fpsLabel");
const fpsFill = document.getElementById("fpsFill");
let fps = 0;

// Animation
function animate(){
    requestAnimationFrame(animate);
    fps++;

    // Soft-body physics
    for(let i=0; i<vertices.length; i++){
        let orig = origPositions[i];
        velocities[i] += (orig - vertices[i]) * spring;
        velocities[i] *= damping;
        vertices[i] += velocities[i];
    }
    sphereGeom.attributes.position.needsUpdate = true;
    sphereGeom.computeVertexNormals();

    // Apply spin
    sphere.rotation.x += spinVelocity.x;
    sphere.rotation.y += spinVelocity.y;
    sphere.rotation.z += spinVelocity.z;
    spinVelocity.multiplyScalar(spinDamping);

    // Update material color
    material.color.set(colorInput.value);

    // Slider scale
    let s = parseFloat(sizeSlider.value);
    sphere.scale.set(s, s, s);

    renderer.render(scene, camera);
}
animate();
document.getElementById("openLogs").addEventListener("click", () => {
    const logWindow = window.open(".commit/logs.html", "_blank", "noopener");

    if (!logWindow) {
        console.warn("Popup blocked. Could not open logs.html.");
    }
});

setInterval(() => {
    fpsLabel.textContent = "FPS: " + fps;

    const percent = Math.min(fps, 60) / 60 * 100;
    fpsFill.style.width = percent + "%";

    if (fps >= 50) {
        fpsFill.style.background = "#00ff66"; // Green
    } else if (fps >= 30) {
        fpsFill.style.background = "#ffcc00"; // Yellow
    } else {
        fpsFill.style.background = "#ff4444"; // Red
    }

    fps = 0;
}, 1000);
</script>
</body>
</html>
