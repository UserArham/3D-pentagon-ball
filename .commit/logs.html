<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Logs</title>

<style>
*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    background:#1e1e1e;
    color:#ffffff;
    font-family:Consolas,monospace;
    overflow:hidden;
}

#header{
    height:48px;
    background:#252526;
    border-bottom:1px solid #444;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 12px;
}

#title{
    font-size:18px;
    font-weight:bold;
}

#toolbar{
    display:flex;
    gap:8px;
}

button{
    background:#333;
    color:white;
    border:1px solid #555;
    padding:6px 12px;
    cursor:pointer;
}

button:hover{
    background:#444;
}

input[type=text]{
    background:#2b2b2b;
    color:white;
    border:1px solid #555;
    padding:6px;
    width:180px;
}

#stats{
    height:32px;
    background:#202020;
    border-bottom:1px solid #333;
    display:flex;
    align-items:center;
    gap:24px;
    padding:0 12px;
    font-size:13px;
}

.stat{
    color:#cccccc;
}

#console{
    height:calc(100vh - 80px);
    overflow-y:auto;
    padding:10px;
    white-space:pre-wrap;
    word-break:break-word;
}

.line{
    padding:2px 0;
}

.time{
    color:#888;
}

.LOG{
    color:#ffffff;
}

.INFO{
    color:#55b7ff;
}

.WARN{
    color:#ffd54f;
}

.ERROR{
    color:#ff6666;
}

.DEBUG{
    color:#99ff99;
}

.SUCCESS{
    color:#66ff66;
}

hr{
    border:none;
    border-top:1px solid #333;
}
</style>

</head>
<body>

<div id="header">

<div id="title">
3D Ball Diagnostics Console
</div>

<div id="toolbar">

<button id="clearBtn">
Clear
</button>

<button id="copyBtn">
Copy
</button>

<button id="downloadBtn">
Download
</button>

<label>
<input type="checkbox" id="autoScroll" checked>
Auto Scroll
</label>

<input
id="searchBox"
type="text"
placeholder="Search logs...">

</div>

</div>

<div id="stats">

<div class="stat">
Total:
<span id="totalLogs">0</span>
</div>

<div class="stat">
Info:
<span id="infoLogs">0</span>
</div>

<div class="stat">
Warnings:
<span id="warnLogs">0</span>
</div>

<div class="stat">
Errors:
<span id="errorLogs">0</span>
</div>

<div class="stat">
Debug:
<span id="debugLogs">0</span>
</div>

<div class="stat">
FPS:
<span id="fpsValue">--</span>
</div>

</div>

<div id="console"></div>

<script>

const consoleView=document.getElementById("console");

const totalLogs=document.getElementById("totalLogs");
const infoLogs=document.getElementById("infoLogs");
const warnLogs=document.getElementById("warnLogs");
const errorLogs=document.getElementById("errorLogs");
const debugLogs=document.getElementById("debugLogs");

const autoScroll=document.getElementById("autoScroll");
const searchBox=document.getElementById("searchBox");

let total=0;
let info=0;
let warn=0;
let error=0;
let debug=0;

const stored=[];

function updateCounters(){

totalLogs.textContent=total;
infoLogs.textContent=info;
warnLogs.textContent=warn;
errorLogs.textContent=error;
debugLogs.textContent=debug;

}

function timestamp(){

return new Date().toLocaleTimeString();

}

function addLog(type,message){

const line=document.createElement("div");

line.className="line "+type;

line.dataset.message=message.toLowerCase();

line.innerHTML=
'<span class="time">['+
timestamp()+
']</span> <b>'+
type+
'</b> '+
message;

consoleView.appendChild(line);

stored.push(line.textContent);

total++;

switch(type){

case "INFO":
case "SUCCESS":
info++;
break;

case "WARN":
warn++;
break;

case "ERROR":
error++;
break;

case "DEBUG":
debug++;
break;

}

updateCounters();

if(autoScroll.checked){

consoleView.scrollTop=consoleView.scrollHeight;

}

}
searchBox.addEventListener("input",()=>{

const q=searchBox.value.toLowerCase();

document.querySelectorAll(".line").forEach(line=>{

line.style.display=
line.dataset.message.includes(q)?"block":"none";

});

});

document.getElementById("clearBtn").onclick=()=>{

consoleView.innerHTML="";

stored.length=0;

total=0;
info=0;
warn=0;
error=0;
debug=0;

updateCounters();

};

document.getElementById("copyBtn").onclick=()=>{

navigator.clipboard.writeText(stored.join("\n"));

addLog("SUCCESS","Logs copied to clipboard.");

};

document.getElementById("downloadBtn").onclick=()=>{

const blob=new Blob(
[stored.join("\n")],
{type:"text/plain"}
);

const a=document.createElement("a");

a.href=URL.createObjectURL(blob);

a.download="console-log.txt";

a.click();

URL.revokeObjectURL(a.href);

addLog("SUCCESS","Downloaded console-log.txt");

};

window.addEventListener("message",(event)=>{

const data=event.data;

if(!data) return;

if(data.type&&data.message){

addLog(
data.type.toUpperCase(),
String(data.message)
);

}

});

addLog("SUCCESS","JavaScript enabled.");

addLog("INFO","Browser: "+navigator.userAgent);

if(window.WebGLRenderingContext){

addLog("SUCCESS","WebGL supported.");

}else{

addLog("ERROR","WebGL NOT supported.");

}

if(window.WebGL2RenderingContext){

addLog("SUCCESS","WebGL2 supported.");

}else{

addLog("WARN","WebGL2 unavailable.");

}

if(
!("fetch" in window)||
!("Promise" in window)||
!("requestAnimationFrame" in window)
){

addLog(
"ERROR",
"Unsupported browser features detected."
);

}else{

addLog(
"SUCCESS",
"Modern browser features available."
);

}

window.addEventListener("error",e=>{

addLog(
"ERROR",
e.message+
" @ "+
e.filename+
":"+
e.lineno+
":"+
e.colno
);

});

window.addEventListener(
"unhandledrejection",
e=>{

addLog(
"ERROR",
"Unhandled Promise: "+e.reason
);

});

window.addEventListener("load",()=>{

addLog("SUCCESS","logs.html fully loaded.");

const style=getComputedStyle(document.body);

if(style.backgroundColor==="rgba(0, 0, 0, 0)"){

addLog(
"WARN",
"Possible stylesheet issue detected."
);

}else{

addLog(
"SUCCESS",
"Styles loaded correctly."
);

}

});

let fps=0;

setInterval(()=>{

document.getElementById("fpsValue").textContent=fps;

if(fps<20){

addLog(
"WARN",
"Low FPS ("+fps+" FPS)"
);

}

fps=0;

},1000);

function frame(){

fps++;

requestAnimationFrame(frame);

}

frame();

addLog(
"INFO",
"Waiting for messages from the 3D demo..."
);

</script>

</body>
</html>
